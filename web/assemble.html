<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단계별 조립</title>
<style>
  :root { --bg: #f4f5f7; --panel: #ffffffee; --text: #1d2330; --muted: #667085; --accent: #2563eb; --line: #d0d5dd; --done: #12b76a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161b; --panel: #1f232bee; --text: #e8eaf0; --muted: #98a2b3; --line: #344054; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: fixed; background: var(--panel); border-radius: 12px; box-shadow: 0 2px 12px #0003; }
  #card { left: 16px; right: 16px; bottom: 16px; max-width: 560px; margin: 0 auto; padding: 14px 16px; }
  #progress { color: var(--muted); font-size: 13px; }
  #bar { height: 4px; background: var(--line); border-radius: 2px; margin: 6px 0 10px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  #desc { margin: 0 0 12px; line-height: 1.5; }
  #buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; flex: 1; }
  button:disabled { opacity: .4; cursor: default; }
  #side { top: 16px; right: 16px; width: 260px; max-height: calc(100% - 240px); overflow: auto; padding: 10px; font-size: 13px; }
  #side h2 { font-size: 13px; color: var(--muted); margin: 2px 4px 8px; font-weight: 600; }
  #side ol { list-style: none; margin: 0; padding: 0; }
  #side li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; }
  #side li .n { color: var(--muted); min-width: 1.6em; text-align: right; }
  #side li.done .n { color: var(--done); }
  #side li.current { background: var(--accent); color: #fff; }
  #side li.current .n { color: #fff; }
  #side li.future { color: var(--muted); }
  #opts { top: 16px; left: 16px; padding: 10px 12px; font-size: 13px; }
  #opts label { display: block; margin: 2px 0; }
  #warn { color: #d92d20; font-size: 12px; margin-top: 6px; }
  @media (max-width: 720px) { #side { display: none; } }
</style>
</head>
<body>
<div id="opts" class="panel">
  <label><input type="checkbox" id="ghost" checked> 앞으로 조립할 부분 흐리게 보기</label>
  <label><input type="checkbox" id="follow" checked> 현재 단계로 카메라 이동</label>
  <div id="warn"></div>
</div>
<div id="side" class="panel"><h2>조립 순서</h2><ol id="list"></ol></div>
<div id="card" class="panel">
  <div id="progress">불러오는 중…</div>
  <div id="bar"><div></div></div>
  <p id="title"></p>
  <p id="desc"></p>
  <div id="buttons">
    <button id="first" title="처음으로">⏮</button>
    <button id="prev">이전</button>
    <button id="replay" title="이 단계 다시 보기">↻</button>
    <button id="next" class="primary">다음 단계</button>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---------- 장면 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(css('--bg'));
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function materialFor(name) {
  const n = name.toLowerCase();
  if (n.includes('xt30')) return { color: 0xe0b020, metalness: 0.1, roughness: 0.5 };
  if (n.includes('md_rev') || n.includes('usb')) return { color: 0x1f6f3f, metalness: 0.2, roughness: 0.6 };
  if (n.includes('carbon')) return { color: 0x202020, metalness: 0.3, roughness: 0.35 };
  if (n.includes('phact')) return { color: 0x9aa3ad, metalness: 0.8, roughness: 0.3 };
  if (n.includes('link')) return { color: 0xb8bec6, metalness: 0.9, roughness: 0.25 };
  return { color: 0xf2f2f2, metalness: 0.0, roughness: 0.7 };
}

// ---------- 데이터 ----------
const sanitize = (s) => THREE.PropertyBinding.sanitizeNodeName(s);
function matcher(pattern) {
  const p = sanitize(pattern);
  const re = new RegExp('^' + p.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$');
  const wantsCopy = p.includes('#');
  return (name) => re.test(name) && (wantsCopy || !name.includes('#'));
}

let steps = [], meshes = new Map(), center = new THREE.Vector3(), modelSize = 1;
let current = -1;          // 마지막으로 조립된 단계 (-1 = 아무것도 없음)
const anims = [];          // 진행 중인 날아 들어오기 애니메이션

const assembly = await (await fetch('assets/forearm.assembly.json')).json();
const gltf = await new GLTFLoader().loadAsync(assembly.model);
const root = gltf.scene;
scene.add(root);

const box = new THREE.Box3().setFromObject(root);
box.getCenter(center);
modelSize = box.getSize(new THREE.Vector3()).length();

root.traverse((o) => {
  if (!o.isMesh) return;
  o.geometry.computeVertexNormals();
  o.userData.solid = new THREE.MeshStandardMaterial(materialFor(o.name));
  o.userData.ghost = new THREE.MeshStandardMaterial({ color: 0x8aa4ff, transparent: true, opacity: 0.12, depthWrite: false });
  o.userData.home = o.position.clone();
  meshes.set(o.name, o);
});

// 단계별 부품 찾기
const assigned = new Set();
for (const s of assembly.steps) {
  const list = [];
  for (const pat of s.parts) {
    const m = matcher(pat);
    for (const [name, mesh] of meshes) if (m(name) && !assigned.has(name)) { list.push(mesh); assigned.add(name); }
  }
  // 날아 들어오는 방향: 지정 없으면 모델 중심에서 바깥쪽
  let dir;
  if (s.dir) dir = new THREE.Vector3(...s.dir).normalize();
  else {
    const c = new THREE.Box3(); list.forEach((m) => c.expandByObject(m));
    dir = c.isEmpty() ? new THREE.Vector3(0, -1, 0) : c.getCenter(new THREE.Vector3()).sub(center).normalize();
    if (dir.lengthSq() < 1e-6) dir.set(0, -1, 0);
  }
  steps.push({ ...s, meshes: list, dir });
}
const leftovers = [...meshes.keys()].filter((n) => !assigned.has(n));
const emptySteps = steps.filter((s) => s.meshes.length === 0).map((s) => s.title);
$('warn').textContent = [
  leftovers.length ? `순서표에 없는 부품 ${leftovers.length}개 (항상 흐리게 표시)` : '',
  emptySteps.length ? `부품을 못 찾은 단계: ${emptySteps.join(', ')}` : '',
].filter(Boolean).join(' · ');
if (leftovers.length) console.warn('순서표에 없는 부품:', leftovers);

// 단계 목록
steps.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${i + 1}</span><span></span>`;
  li.lastChild.textContent = s.title;
  li.onclick = () => goTo(i);
  $('list').appendChild(li);
});

// ---------- 표시 ----------
function setLook(mesh, look) {
  mesh.visible = look !== 'hidden';
  mesh.material = look === 'ghost' ? mesh.userData.ghost : mesh.userData.solid;
  mesh.material.emissive?.setHex(look === 'active' ? 0x1d4ed8 : 0x000000);
  mesh.material.emissiveIntensity = look === 'active' ? 0.35 : 0;
}

function render() {
  const ghost = $('ghost').checked;
  steps.forEach((s, i) => {
    const look = i < current ? 'solid' : i === current ? 'active' : ghost ? 'ghost' : 'hidden';
    s.meshes.forEach((m) => setLook(m, look));
  });
  for (const n of leftovers) setLook(meshes.get(n), ghost ? 'ghost' : 'hidden');

  [...$('list').children].forEach((li, i) => {
    li.className = i < current ? 'done' : i === current ? 'current' : 'future';
  });
  $('list').children[current]?.scrollIntoView({ block: 'nearest' });

  const total = steps.length;
  $('progress').textContent = current < 0 ? `총 ${total}단계 · 아래 버튼으로 시작하세요` : `${current + 1} / ${total} 단계`;
  $('bar').firstElementChild.style.width = `${((current + 1) / total) * 100}%`;
  const s = steps[current];
  $('title').textContent = s ? s.title : '조립을 시작해 볼까요?';
  $('desc').textContent = s ? (s.desc || '') : (assembly.status || '');
  $('prev').disabled = current < 0;
  $('first').disabled = current < 0;
  $('replay').disabled = current < 0;
  $('next').textContent = current < 0 ? '조립 시작' : current >= total - 1 ? '완성!' : '다음 단계';
  $('next').disabled = current >= total - 1;
}

function flyIn(step) {
  const dist = modelSize * 0.25;
  for (const m of step.meshes) {
    // 월드 방향을 부품 부모 좌표로 바꿔서 이동
    const worldDir = step.dir.clone();
    const parentInv = new THREE.Matrix4().copy(m.parent.matrixWorld).invert();
    const localDir = worldDir.transformDirection(parentInv).multiplyScalar(dist / m.parent.getWorldScale(new THREE.Vector3()).x);
    anims.push({ mesh: m, from: m.userData.home.clone().add(localDir), to: m.userData.home.clone(), t: 0 });
  }
}

function focusOn(step) {
  if (!$('follow').checked || !step || !step.meshes.length) return;
  const b = new THREE.Box3(); step.meshes.forEach((m) => b.expandByObject(m));
  focusTarget = b.getCenter(new THREE.Vector3());
}

function goTo(i) {
  anims.length = 0;
  steps.forEach((s) => s.meshes.forEach((m) => m.position.copy(m.userData.home)));
  current = Math.max(-1, Math.min(steps.length - 1, i));
  render();
  if (steps[current]) { flyIn(steps[current]); focusOn(steps[current]); }
}

$('next').onclick = () => goTo(current + 1);
$('prev').onclick = () => goTo(current - 1);
$('first').onclick = () => { goTo(-1); focusTarget = center.clone(); };
$('replay').onclick = () => goTo(current);
$('ghost').onchange = render;
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

// 카메라 시작 위치
controls.target.copy(center);
camera.position.copy(center).add(new THREE.Vector3(modelSize * 0.6, -modelSize * 0.9, modelSize * 0.7));
camera.up.set(0, -1, 0);
let focusTarget = center.clone();
render();

const clock = new THREE.Clock();
const ease = (t) => 1 - Math.pow(1 - t, 3);
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (let k = anims.length - 1; k >= 0; k--) {
    const a = anims[k];
    a.t = Math.min(1, a.t + dt / 0.9);
    a.mesh.position.lerpVectors(a.from, a.to, ease(a.t));
    if (a.t >= 1) anims.splice(k, 1);
  }
  controls.target.lerp(focusTarget, Math.min(1, dt * 3));
  controls.update();
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
