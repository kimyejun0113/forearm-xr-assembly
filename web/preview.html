<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD 미리보기</title>
<style>
  :root { --bg: #f4f5f7; --panel: #ffffffee; --text: #1d2330; --muted: #667085; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161b; --panel: #1f232bee; --text: #e8eaf0; --muted: #98a2b3; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; }
  #ui { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 12px 14px; border-radius: 10px; max-width: 320px; box-shadow: 0 2px 10px #0002; font-size: 14px; }
  #ui h1 { font-size: 15px; margin: 0 0 8px; }
  #ui label { display: block; margin-top: 8px; color: var(--muted); }
  #ui input[type=range] { width: 100%; }
  #picked { margin-top: 10px; font-weight: 600; min-height: 1.2em; word-break: break-all; }
  #stats { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="ui">
  <h1>forearm.STEP 미리보기</h1>
  <div id="stats">불러오는 중…</div>
  <label>분해 정도 <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
  <div id="picked">부품을 클릭하면 이름이 보여요</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#f4f5f7');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 20);
const controls = new OrbitControls(camera, renderer.domElement);

// 부품 이름으로 재질 고르기 (나중에 XR 화면에서도 같은 규칙 사용)
function materialFor(name) {
  const n = name.toLowerCase();
  if (n.includes('xt30')) return { color: 0xe0b020, metalness: 0.1, roughness: 0.5 };
  if (n.includes('md_rev') || n.includes('usb')) return { color: 0x1f6f3f, metalness: 0.2, roughness: 0.6 };
  if (n.includes('carbon')) return { color: 0x202020, metalness: 0.3, roughness: 0.35 };
  if (n.includes('phact')) return { color: 0x9aa3ad, metalness: 0.8, roughness: 0.3 };
  if (n.includes('link')) return { color: 0xb8bec6, metalness: 0.9, roughness: 0.25 };
  return { color: 0xf2f2f2, metalness: 0.0, roughness: 0.7 };
}

const parts = [];
new GLTFLoader().load('assets/forearm.glb', (gltf) => {
  const root = gltf.scene;
  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.material = new THREE.MeshStandardMaterial(materialFor(o.name));
    o.geometry.computeVertexNormals();
    const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
    parts.push({ mesh: o, home: o.position.clone(), dir: c.sub(center) });
  });
  scene.add(root);
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size * 0.8, size * 0.5, size * 0.9));
  controls.update();
  document.getElementById('stats').textContent =
    `부품 ${parts.length}개 · 전체 ${Math.round(box.getSize(new THREE.Vector3()).x * 1000)} × ` +
    `${Math.round(box.getSize(new THREE.Vector3()).y * 1000)} × ${Math.round(box.getSize(new THREE.Vector3()).z * 1000)} mm`;
}, undefined, (e) => { document.getElementById('stats').textContent = '불러오기 실패: ' + e.message; });

document.getElementById('explode').addEventListener('input', (e) => {
  const k = Number(e.target.value) * 1.5;
  for (const p of parts) p.mesh.position.copy(p.home).addScaledVector(p.dir, k);
});

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let lastPicked = null;
renderer.domElement.addEventListener('click', (e) => {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(parts.map((p) => p.mesh))[0];
  if (lastPicked) lastPicked.material.emissive.setHex(0x000000);
  lastPicked = hit ? hit.object : null;
  if (lastPicked) lastPicked.material.emissive.setHex(0x1d4ed8);
  document.getElementById('picked').textContent = lastPicked ? lastPicked.name : '부품을 클릭하면 이름이 보여요';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
