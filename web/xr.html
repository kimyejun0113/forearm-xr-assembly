<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조립·분해 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root { --bg: #f4f5f7; --panel: #ffffffee; --text: #1d2330; --muted: #667085; --accent: #2563eb; --line: #d0d5dd; --warn: #b42318; --chip: #eef2ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161b; --panel: #1f232bee; --text: #e8eaf0; --muted: #98a2b3; --line: #344054; --warn: #f97066; --chip: #1e2a4a; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: fixed; background: var(--panel); border-radius: 12px; box-shadow: 0 2px 12px #0003; }
  #help { top: 16px; left: 16px; max-width: min(320px, calc(100% - 64px)); padding: 10px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  #help b { color: var(--text); }
  #help label { display: block; margin-top: 6px; color: var(--text); }
  #card { left: 16px; right: 16px; bottom: 16px; max-width: 600px; margin: 0 auto; padding: 12px 14px; font-size: 14px; }
  #progress { color: var(--muted); font-size: 12.5px; }
  #bar { height: 4px; background: var(--line); border-radius: 2px; margin: 5px 0 8px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #title { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  #chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .chip.bolt { background: #fef3c7; color: #92400e; }
  #desc { margin: 4px 0; line-height: 1.45; }
  #warn { color: var(--warn); margin: 4px 0; font-size: 13px; }
  #status { color: var(--muted); font-size: 12.5px; min-height: 1.2em; margin: 4px 0 8px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; flex: 1; }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<div id="help" class="panel">
  <b>Quest</b>: 트리거·손가락 핀치로 부품 잡고 당기기 · <b>그립 버튼</b>으로 모델 옮기기 · <b>빈 공간 양손 핀치</b>: 확대·축소·이동 · <b>한 손 핀치 끌기</b>: 돌리기 · 버튼 사이 빈 곳을 잡으면 버튼 패널 이동 · 버튼에 화면 가운데를 <b>1초 맞추면</b> 눌림<br>
  <b>PC</b>: 부품을 끌어 빼기 · 빈 곳 드래그로 회전
  <label><input type="checkbox" id="physics" checked> 실제처럼: 막힌 부품과 볼트로 고정된 부품은 안 빠짐</label>
  <label><input type="checkbox" id="fade"> 앞 단계 흐리게</label>
</div>
<div id="card" class="panel">
  <div id="progress"></div>
  <div id="bar"><div></div></div>
  <p id="title"></p>
  <div id="chips"></div>
  <p id="desc"></p>
  <p id="warn"></p>
  <div id="status"></div>
  <div class="row">
    <button id="first" title="처음부터">⏮</button>
    <button id="prev">◀ 이전</button>
    <button id="replay" title="이 단계 다시 보기">↻</button>
    <button id="next" class="primary">다음 ▶</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="all">전체 보기 (자유 분해)</button>
    <button id="spread">모두 펼치기</button>
    <button id="reset">모두 조립</button>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ======================= 장면 =======================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const desktopBg = new THREE.Color(css('--bg'));
scene.background = desktopBg;
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(0.5, 2, 0.8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -0.6, right: 0.6, top: 0.6, bottom: -0.6, near: 0.1, far: 4 });
scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 20);
camera.position.set(0.25, 1.75, 1.15);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.98, 0);
orbit.update();

// ======================= 데이터 =======================
function materialFor(name) {
  const n = name.toLowerCase();
  if (n.startsWith('bolt')) return { color: 0x3f3f46, metalness: 0.9, roughness: 0.35 };
  if (n.includes('xt30')) return { color: 0xe0b020, metalness: 0.1, roughness: 0.5 };
  if (n.includes('md_rev') || n.includes('usb')) return { color: 0x1f6f3f, metalness: 0.2, roughness: 0.6 };
  if (n.includes('carbon')) return { color: 0x202020, metalness: 0.3, roughness: 0.35 };
  if (n.includes('phact')) return { color: 0x9aa3ad, metalness: 0.8, roughness: 0.3 };
  if (n.includes('link')) return { color: 0xb8bec6, metalness: 0.9, roughness: 0.25 };
  return { color: 0xf2f2f2, metalness: 0.0, roughness: 0.7 };
}
const sanitize = (s) => THREE.PropertyBinding.sanitizeNodeName(s);
function matcher(pattern) {
  const p = sanitize(pattern);
  const re = new RegExp('^' + p.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$');
  const wantsCopy = p.includes('#');
  return (name) => re.test(name) && (wantsCopy || !name.includes('#'));
}

const assembly = await (await fetch('assets/forearm.assembly.json', { cache: 'no-store' })).json();
const gltf = await new GLTFLoader().loadAsync(assembly.model);
const cad = gltf.scene;                 // CAD 좌표 그대로 (m)
cad.updateMatrixWorld(true);
const cadCenter = new THREE.Box3().setFromObject(cad).getCenter(new THREE.Vector3());

// 볼트: CAD 구멍 위치로 계산된 것을 원통 + 머리로 그림
const boltData = new Map((assembly.bolts || []).map((b) => [b.id, b]));
for (const b of boltData.values()) {
  const head = new THREE.Vector3(...b.head), tail = new THREE.Vector3(...b.tail);
  const len = head.distanceTo(tail), r = b.diameter / 2;
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 12));
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.8, r * 1.8, r * 1.6, 16));
  cap.position.y = len / 2 + r * 0.8;
  shaft.name = cap.name = b.id;
  g.add(shaft, cap);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...b.dir).normalize());
  g.position.copy(head).add(tail).multiplyScalar(0.5);
  // 볼트는 하나의 메시로 합쳐서 부품처럼 다룸
  g.updateMatrixWorld(true);
  const merged = mergeGroup(g, b.id);
  cad.add(merged);
}
function mergeGroup(group, name) {
  const geos = [];
  group.traverse((o) => { if (o.isMesh) { const gg = o.geometry.clone(); gg.applyMatrix4(o.matrixWorld); geos.push(gg); } });
  const pos = [], idx = [];
  let off = 0;
  for (const gg of geos) {
    const g2 = gg.index ? gg : gg;
    const p = g2.attributes.position.array;
    for (let i = 0; i < p.length; i++) pos.push(p[i]);
    const ind = g2.index ? g2.index.array : [...Array(p.length / 3).keys()];
    for (const i of ind) idx.push(i + off);
    off += p.length / 3;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  const m = new THREE.Mesh(geo);
  m.name = name;
  return m;
}
cad.updateMatrixWorld(true);

// 모델 묶음: 덮개 쪽(-Y)이 위를 보게 뒤집고 가운데를 원점에
const model = new THREE.Group();
const pivot = new THREE.Group();
pivot.rotation.x = Math.PI;
cad.position.sub(cadCenter);
pivot.add(cad);
model.add(pivot);
model.position.set(0, 1.0, 0);
scene.add(model);

// 부품 정보
const parts = [];
const byMesh = new Map();
cad.traverse((o) => {
  if (!o.isMesh) return;
  o.geometry.computeVertexNormals();
  o.material = new THREE.MeshStandardMaterial(materialFor(o.name));
  o.castShadow = o.receiveShadow = true;
  const p = { mesh: o, home: o.position.clone(), offset: 0, step: -1, axisLocal: null, max: 0.12, bolt: boltData.get(o.name) || null };
  parts.push(p);
  byMesh.set(o, p);
});

// 단계 (조립 순서)
const steps = assembly.steps.map((s, i) => {
  const list = [];
  for (const pat of s.parts || []) {
    const m = matcher(pat);
    for (const p of parts) if (p.step < 0 && !p.bolt && m(p.mesh.name)) { p.step = i; list.push(p); }
  }
  for (const id of s.bolts || []) {
    const p = parts.find((q) => q.bolt && q.mesh.name === id);
    if (p && p.step < 0) { p.step = i; list.push(p); }
  }
  let dir = s.dir ? new THREE.Vector3(...s.dir) : null;
  if (!dir) {
    const b = new THREE.Box3(); list.forEach((p) => b.expandByObject(p.mesh));
    dir = b.isEmpty() ? new THREE.Vector3(0, -1, 0) : b.getCenter(new THREE.Vector3()).sub(cadCenter);
    if (dir.lengthSq() < 1e-8) dir.set(0, -1, 0);
  }
  return { ...s, index: i, parts: list, dir: dir.normalize() };
});
// 순서표에 없는 부품은 마지막 단계에 붙임 (항상 보이게)
const orphans = parts.filter((p) => p.step < 0);
if (orphans.length) console.warn('순서표에 없는 부품:', orphans.map((p) => p.mesh.name));

for (const p of parts) {
  const dirCad = p.bolt ? new THREE.Vector3(...p.bolt.dir) : p.step >= 0 ? steps[p.step].dir : new THREE.Vector3(0, -1, 0);
  const parentInv = new THREE.Matrix4().copy(p.mesh.parent.matrixWorld).invert();
  p.axisLocal = dirCad.clone().normalize().transformDirection(parentInv);
  const size = new THREE.Box3().setFromObject(p.mesh).getSize(new THREE.Vector3()).length();
  p.max = p.bolt ? size + 0.03 : THREE.MathUtils.clamp(size * 2, 0.06, 0.2);
}
for (const s of steps) {
  if (!s.unit || !s.parts.length) continue;
  const b = new THREE.Box3(); s.parts.forEach((p) => b.expandByObject(p.mesh));
  const max = THREE.MathUtils.clamp(b.getSize(new THREE.Vector3()).length() * 1.2, 0.08, 0.2);
  s.parts.forEach((p) => { p.max = max; });
}

const membersOf = (p) => (p.step >= 0 && steps[p.step].unit ? steps[p.step].parts : [p]);
const nameOf = (p) => p.bolt ? `${p.bolt.size} 볼트` : (p.step >= 0 && steps[p.step].unit ? steps[p.step].title : p.mesh.name.replace(/#2$/, ' (2)'));
function applyOffset(p) { p.mesh.position.copy(p.home).addScaledVector(p.axisLocal, p.offset); }
const axisWorld = (p) => p.axisLocal.clone().transformDirection(p.mesh.parent.matrixWorld).normalize();

// ======================= 조립 단계 상태 =======================
let shown = steps.length - 1;        // 여기까지 조립된 단계가 보임 (-1 = 아무것도 없음)
const visible = (p) => p.step < 0 || p.step <= shown;

const SEPARATED = 0.6;
const isOut = (p) => !visible(p) || p.offset >= p.max * SEPARATED;

// 막힘 규칙: (1) assembly.json 의 blockers(형상 계산 결과)가 있으면 그것, (2) 없으면 조립 역순
function blockingSteps(p) {
  if (p.step < 0) return [];
  const s = steps[p.step];
  if (Array.isArray(s.blockers)) return s.blockers.map((i) => steps[i]).filter(Boolean);
  return steps.filter((t) => t.index > p.step);
}
function blockerOf(p) {
  if (!$('physics').checked) return null;
  return blockingSteps(p).find((t) => t.parts.some((q) => !isOut(q))) || null;
}

// ======================= 그림자, 이동 손잡이, 글자 =======================
const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), new THREE.ShadowMaterial({ opacity: 0.25 }));
shadowFloor.rotation.x = -Math.PI / 2;
shadowFloor.position.y = -0.06;
shadowFloor.receiveShadow = true;
model.add(shadowFloor);

function makeLabel(w = 512, h = 128) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  s.renderOrder = 10;
  s.userData = { c, tex, text: null };
  s.scale.set(0.16, 0.04, 1);
  return s;
}
function setLabel(s, lines, bg = 'rgba(17,24,39,0.85)') {
  const key = lines.join('\n') + bg;
  if (s.userData.text === key) return;
  s.userData.text = key;
  const { c, tex } = s.userData, g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, c.width, c.height, 28); g.fill();
  g.fillStyle = '#fff'; g.textBaseline = 'middle';
  lines.forEach((t, i) => {
    g.font = `${i === 0 ? 'bold 40px' : '32px'} "Malgun Gothic", sans-serif`;
    g.fillText(t, 24, c.height / (lines.length + 1) * (i + 1));
  });
  tex.needsUpdate = true;
}

const partLabel = makeLabel(640, 150);
partLabel.scale.set(0.2, 0.047, 1);
partLabel.visible = false;
scene.add(partLabel);

function buzz(state, strength = 0.5, ms = 40) { state?.gamepad?.hapticActuators?.[0]?.pulse?.(strength, ms); }

// ======================= 강조 표시 =======================
const hovered = new Set(), grabbed = new Set(), flashing = new Map();
function updateLook(dt) {
  for (const [p, t] of flashing) { if (t - dt <= 0) flashing.delete(p); else flashing.set(p, t - dt); }
  const fade = $('fade').checked;
  for (const p of parts) {
    const m = p.mesh.material;
    p.mesh.visible = visible(p);
    const faded = fade && p.step >= 0 && p.step < shown && !grabbed.has(p) && !hovered.has(p);
    m.transparent = faded; m.opacity = faded ? 0.25 : 1; m.depthWrite = !faded;
    if (flashing.has(p)) { m.emissive.setHex(Math.floor(flashing.get(p) * 8) % 2 ? 0xdc2626 : 0); m.emissiveIntensity = 0.7; }
    else if (grabbed.has(p)) { m.emissive.setHex(0x16a34a); m.emissiveIntensity = 0.55; }
    else if (hovered.has(p)) { m.emissive.setHex(0x3b82f6); m.emissiveIntensity = 0.35; }
    else if (agentHi.has(p)) { m.emissive.setHex(0xf59e0b); m.emissiveIntensity = 0.35 + 0.3 * Math.abs(Math.sin(performance.now() / 250)); }
    else if (p.step === shown && shown < steps.length - 1 + 1 && guideActive) { m.emissive.setHex(0x1d4ed8); m.emissiveIntensity = 0.25; }
    else { m.emissive.setHex(0); m.emissiveIntensity = 0; }
  }
}
function showPartLabel(p) {
  const pct = Math.round((p.offset / p.max) * 100);
  setLabel(partLabel, [nameOf(p), isOut(p) ? '분리됨' : `${pct}% 빠짐`], isOut(p) ? 'rgba(22,163,74,0.92)' : 'rgba(17,24,39,0.85)');
  const c = new THREE.Box3(); membersOf(p).forEach((q) => c.expandByObject(q.mesh));
  partLabel.position.set((c.min.x + c.max.x) / 2, c.max.y + 0.05, (c.min.z + c.max.z) / 2);
  partLabel.visible = true;
}

// ======================= 단계 카드 (PC) + 3D 패널 (헤드셋) =======================
let guideActive = false;      // 조립 순서 보기 중이면 현재 단계 부품을 파랗게
let statusText = '';
function setStatus(t) { statusText = t; $('status').textContent = t; drawPanel(); }

function stepInfo() {
  const s = steps[shown];
  if (shown < 0) return { head: `총 ${steps.length}단계`, title: '처음부터 조립해 볼까요?', chips: [], desc: '다음을 누르면 첫 부품부터 하나씩 나타나요.', warn: '' };
  const bolts = s.parts.filter((p) => p.bolt);
  const others = s.parts.filter((p) => !p.bolt);
  const chips = s.unit ? [{ t: s.title }] : others.map((p) => ({ t: nameOf(p) }));
  if (bolts.length) chips.push({ t: `${bolts[0].bolt.size} 볼트 × ${bolts.length}`, bolt: true });
  return {
    head: `${shown + 1} / ${steps.length} 단계${shown === steps.length - 1 && !guideActive ? ' · 전체' : ''}`,
    title: s.title, chips, desc: s.desc || '', warn: s.warn || '',
  };
}
function renderCard() {
  const i = stepInfo();
  $('progress').textContent = i.head;
  $('bar').firstElementChild.style.width = `${((shown + 1) / steps.length) * 100}%`;
  $('title').textContent = i.title;
  $('chips').innerHTML = '';
  for (const c of i.chips) {
    const el = document.createElement('span');
    el.className = 'chip' + (c.bolt ? ' bolt' : '');
    el.textContent = c.t;
    $('chips').appendChild(el);
  }
  $('desc').textContent = i.desc;
  $('warn').textContent = i.warn ? '주의. ' + i.warn : '';
  $('prev').disabled = shown < 0;
  $('next').disabled = shown >= steps.length - 1;
  drawPanel();
}

// 기능 버튼만 있는 패널 (설명 창은 따로). 버튼 사이 빈 곳을 잡으면 패널이 옮겨짐
const PANEL_W = 1024, PANEL_H = 376;
const panelCanvas = document.createElement('canvas');
panelCanvas.width = PANEL_W; panelCanvas.height = PANEL_H;
const pctx = panelCanvas.getContext('2d');
const panelTex = new THREE.CanvasTexture(panelCanvas);
panelTex.colorSpace = THREE.SRGBColorSpace;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.36 * PANEL_H / PANEL_W), new THREE.MeshBasicMaterial({ map: panelTex, transparent: true }));
panel.userData.isPanel = true;
scene.add(panel);                       // 모델과 따로 움직임
function placePanel() {
  // PC 화면용: 모델 위
  panel.position.copy(model.position).add(new THREE.Vector3(0, 0.28, 0));
  panel.quaternion.copy(model.quaternion);
}
placePanel();

const BW = 232, BH = 96;
const buttons = [
  { x: 24, y: 24, label: '처음부터', act: () => goTo(-1) },
  { x: 272, y: 24, label: '◀ 이전', act: () => goTo(shown - 1), off: () => shown < 0 },
  { x: 520, y: 24, label: '↻ 다시', act: () => goTo(shown), off: () => shown < 0 },
  { x: 768, y: 24, label: '다음 ▶', act: () => goTo(shown + 1), off: () => shown >= steps.length - 1, primary: true },
  { x: 24, y: 140, label: '전체 보기', act: showAll },
  { x: 272, y: 140, label: '모두 펼치기', act: () => animateAll(1) },
  { x: 520, y: 140, label: '모두 조립', act: () => animateAll(0) },
  { x: 768, y: 140, label: '기본 배치', act: () => { placeInFront = true; } },
  { x: 24, y: 256, w: 400, label: () => (VOICE.on ? '🎤 듣는 중 · 끄기' : '🎤 음성 켜기'), on: () => VOICE.on,
    act: () => (VOICE.on ? voiceStop() : voiceStart()) },

];
const bw = (b) => b.w || BW;
const blabel = (b) => (typeof b.label === 'function' ? b.label() : b.label);
let dwell = { button: null, t: 0 };     // 시선으로 누르는 중인 버튼과 진행도(0~1)
function drawPanel() {
  const c = pctx;
  c.clearRect(0, 0, PANEL_W, PANEL_H);
  c.fillStyle = 'rgba(255,255,255,0.9)';
  c.beginPath(); c.roundRect(0, 0, PANEL_W, PANEL_H, 32); c.fill();
  for (const b of buttons) {
    const off = b.off?.(), lit = b.primary || b.on?.(), w = bw(b), label = blabel(b);
    c.globalAlpha = off ? 0.35 : 1;
    c.fillStyle = b.on?.() ? '#dc2626' : lit ? '#2563eb' : '#eef2ff';
    c.beginPath(); c.roundRect(b.x, b.y, w, BH, 22); c.fill();
    if (dwell.button === b && dwell.t > 0) {          // 시선 누르기 진행 막대
      c.fillStyle = lit ? 'rgba(255,255,255,0.45)' : 'rgba(37,99,235,0.35)';
      c.beginPath(); c.roundRect(b.x, b.y, w * dwell.t, BH, 22); c.fill();
    }
    c.fillStyle = lit ? '#fff' : '#1d4ed8';
    c.font = 'bold 34px "Malgun Gothic", sans-serif';
    c.fillText(label, b.x + (w - c.measureText(label).width) / 2, b.y + 60);
    c.globalAlpha = 1;
  }
  panelTex.needsUpdate = true;
}
// 패널 uv → 버튼, 버튼이 아니면 'bar'(잡아서 옮기는 빈 곳)
function panelTarget(uv) {
  const x = uv.x * PANEL_W, y = (1 - uv.y) * PANEL_H;
  return buttons.find((b) => x >= b.x && x <= b.x + bw(b) && y >= b.y && y <= b.y + BH) || 'bar';
}
function pressPanel(uv) {
  const b = panelTarget(uv);
  if (b && b !== 'bar' && !b.off?.()) b.act();
}

const anims = [];   // { parts, from, to, t }
function animateParts(list, from, to) {
  for (const p of list) { p.offset = from; applyOffset(p); }
  anims.push({ list, from, to, t: 0 });
}
function goTo(k) {
  anims.length = 0;
  shown = Math.max(-1, Math.min(steps.length - 1, k));
  guideActive = true;
  for (const p of parts) { p.offset = 0; applyOffset(p); }
  const s = steps[shown];
  if (s) {
    // 볼트는 각자 방향, 나머지는 한꺼번에 날아 들어옴
    animateParts(s.parts, Math.max(...s.parts.map((p) => p.max)) * 0.9, 0);
  }
  setStatus('');
  renderCard();
  agentStep(shown);           // AI 에이전트에 지금 단계를 알림
}
function showAll() { anims.length = 0; guideActive = false; shown = steps.length - 1; renderCard(); setStatus('아무 부품이나 잡아서 분해해 보세요'); }
function animateAll(target) {
  anims.length = 0;
  const vis = parts.filter(visible);
  // 바깥(나중 단계)부터 차례로 펼쳐지게 조금씩 시차
  const byStep = new Map();
  for (const p of vis) { const k = p.step; (byStep.get(k) || byStep.set(k, []).get(k)).push(p); }
  [...byStep.keys()].sort((a, b) => b - a).forEach((k, n) => {
    const list = byStep.get(k);
    anims.push({ list, from: list[0].offset, to: target, t: -n * 0.08, rel: true });
  });
}

$('first').onclick = () => goTo(-1);
$('prev').onclick = () => goTo(shown - 1);
$('replay').onclick = () => goTo(shown);
$('next').onclick = () => goTo(shown + 1);
$('all').onclick = showAll;
$('spread').onclick = () => animateAll(1);
$('reset').onclick = () => animateAll(0);

  if (e.key === 'ArrowLeft') goTo(shown - 1);
});

// ======================= 잡기 =======================
const raycaster = new THREE.Raycaster();
function hitFromRay(origin, dir) {
  raycaster.set(origin, dir);
  const objs = [...parts.filter(visible).map((p) => p.mesh), panel, ...(infoPanel.visible ? [infoPanel] : [])];
  return raycaster.intersectObjects(objs, false)[0] || null;
}
function beginGrab(hit, pointWorld) {
  const obj = hit.object;
  if (obj.userData.isInfo) return { movePanel: true, target: infoPanel };   // 설명 패널은 잡으면 옮겨짐
  if (obj.userData.isPanel) {
    if (panelTarget(hit.uv) === 'bar') return { movePanel: true };
    pressPanel(hit.uv); return null;
  }
  if (obj.userData.isHandle) return { moveModel: true };
  const p = byMesh.get(obj);
  if (!p) return null;
  const b = blockerOf(p);
  if (b) {
    membersOf(p).forEach((q) => flashing.set(q, 0.6));
    setStatus(`먼저 '${b.title}'${b.parts.some((q) => q.bolt) && !b.parts.some((q) => !q.bolt) ? '을(를) 풀어야' : '을(를) 빼야'} 해요`);
    return { blocked: true };
  }
  anims.length = 0;
  const members = membersOf(p);
  members.forEach((q) => grabbed.add(q));
  setStatus(nameOf(p));
  showPartLabel(p);
  return { part: p, members, startOffset: p.offset, startPoint: pointWorld.clone(), wasOut: isOut(p) };
}
function setPartOffset(g, value) {
  const off = THREE.MathUtils.clamp(value, 0, g.part.max);
  for (const q of g.members) { q.offset = off; applyOffset(q); }
}
function updateGrab(g, pointWorld) {
  // 손이 움직인 거리(m)를 모델 배율로 나눠 부품 좌표 거리로
  const d = pointWorld.clone().sub(g.startPoint).dot(axisWorld(g.part)) / model.scale.x;
  setPartOffset(g, g.startOffset + d);
  showPartLabel(g.part);
  const crossed = isOut(g.part) !== g.wasOut;
  g.wasOut = isOut(g.part);
  return crossed;
}
function endGrab(g) {
  if (!g?.part) return;
  g.members.forEach((q) => grabbed.delete(q));
  partLabel.visible = grabbed.size > 0;
  const p = g.part;
  setStatus(`${nameOf(p)} · ${isOut(p) ? '분리됨' : Math.round((p.offset / p.max) * 100) + '% 빠짐'}`);
}

  // 모델 또는 패널을 컨트롤러/손에 붙여서 옮기기

    const g = beginGrab(hit, o);

    if (g?.blocked) { buzz(state, 1, 60); setTimeout(() => buzz(state, 1, 60), 120); return; }
    if (g?.part) buzz(state, 0.6, 50);
    state.grab = g;
  });
  ctrl.addEventListener('selectend', () => { state.selecting = false; state.air = false; stopMove(); endGrab(state.grab); state.grab = null; });

  ctrl.addEventListener('squeezestart', () => {

}

// ======================= 양손 제스처: 확대·축소·이동·회전 =======================
let twoHand = null;
function handPos(s) { return new THREE.Vector3().setFromMatrixPosition(s.ctrl.matrixWorld); }
// 한 손으로 빈 공간을 집고 끌기 → 돌리기 (좌우 = 좌우 회전, 위아래 = 앞뒤 기울기)
const ROT_SPEED = 6;      // 손 1m 움직임 = 6 rad
function updateOneHandRotate() {
  const airs = xrInputs.filter((s) => s.selecting && s.air);
  const others = xrInputs.filter((s) => s.selecting && !s.air);
  for (const s of xrInputs) if (!(s.selecting && s.air)) s.rot = null;
  if (twoHand || airs.length !== 1 || others.length) return;
  const s = airs[0];
  if (performance.now() - s.selectT < 150) return;      // 양손 제스처가 될 수도 있으니 잠깐 기다림
  const p = handPos(s);
  if (!s.rot) { s.rot = { last: p }; return; }
  const d = p.clone().sub(s.rot.last);
  s.rot.last = p;
  const cam = renderer.xr.getCamera();
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion); right.y = 0; right.normalize();
  const up = new THREE.Vector3(0, 1, 0);
  const yaw = d.dot(right) * ROT_SPEED, pitch = -d.dot(up) * ROT_SPEED;
  model.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(up, yaw));
  model.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(right, pitch));
  s.rotating = true;
}

function updateTwoHand() {
  const [a, b] = xrInputs;
  const both = a.selecting && b.selecting;
  if (!both) { if (twoHand) { twoHand = null; setStatus(`크기 ${Math.round(model.scale.x * 100)}%`); } return; }
  if (!twoHand) {
    // 둘 다 빈 공간을 집었거나, 0.4초 안에 거의 동시에 집었으면 양손 제스처로
    const together = Math.abs(a.selectT - b.selectT) < 400;
    if (!((a.air && b.air) || together)) return;
    for (const s of [a, b]) {
      if (s.grab?.part) { setPartOffset(s.grab, s.grab.startOffset); endGrab(s.grab); s.grab = null; }  // 잡은 부품은 원래대로
      if (s.moving) { scene.attach(s.moving); s.moving = null; }
    }
    const pa = handPos(a), pb = handPos(b);
    twoHand = {
      d0: pa.distanceTo(pb), mid0: pa.clone().add(pb).multiplyScalar(0.5),
      ang0: Math.atan2(pb.x - pa.x, pb.z - pa.z),
      scale0: model.scale.x, pos0: model.position.clone(), quat0: model.quaternion.clone(),
    };
    buzz(a, 0.4, 30); buzz(b, 0.4, 30);
  }
  const pa = handPos(a), pb = handPos(b), t = twoHand;
  const k = THREE.MathUtils.clamp(pa.distanceTo(pb) / Math.max(t.d0, 0.01), 0.2 / t.scale0, 5 / t.scale0);
  const mid = pa.clone().add(pb).multiplyScalar(0.5);
  const dAng = Math.atan2(pb.x - pa.x, pb.z - pa.z) - t.ang0;
  model.scale.setScalar(t.scale0 * k);
  model.quaternion.copy(t.quat0).premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dAng));
  // 두 손 가운데를 중심으로 확대·회전하고, 가운데가 움직인 만큼 이동
  const off = t.pos0.clone().sub(t.mid0).multiplyScalar(k).applyAxisAngle(new THREE.Vector3(0, 1, 0), dAng);
  model.position.copy(mid).add(off);
  setStatus(`크기 ${Math.round(model.scale.x * 100)}%`);
}

// ======================= 손 안 쓰고 누르기: 머리 방향(화면 가운데) =======================
// Quest 3 는 눈동자를 추적하지 않아서, '바라보기'는 머리가 향한 화면 정중앙으로 판단한다.
const DWELL_SEC = 1.0;
let dwellCooldown = 0;
const gazeDot = new THREE.Mesh(new THREE.RingGeometry(0.006, 0.010, 32), new THREE.MeshBasicMaterial({ color: 0x2563eb, depthTest: false, transparent: true }));
gazeDot.renderOrder = 12;
scene.add(gazeDot);
let gazeInfo = { hit: false, button: null };
function updateGaze(dt) {
  if (!renderer.xr.isPresenting) return;
  dwellCooldown = Math.max(0, dwellCooldown - dt);
  // 머리 자세: 사용자 카메라에 XR 머리 위치가 들어옴
  const head = renderer.xr.getCamera();
  const o = new THREE.Vector3().setFromMatrixPosition(head.matrixWorld);
  const d = new THREE.Vector3(0, 0, -1).transformDirection(head.matrixWorld);
  raycaster.set(o, d);
  const hit = raycaster.intersectObject(panel, false)[0];
  const target = hit && panelTarget(hit.uv);
  const btn = target && target !== 'bar' && !target.off?.() ? target : null;
  gazeInfo = { hit: !!hit, button: btn ? btn.label : null };
  // 가운데 점은 패널을 볼 때만 보임
  gazeDot.visible = !!hit;
  if (hit) { gazeDot.position.copy(hit.point); gazeDot.quaternion.copy(panel.quaternion); }
  gazeDot.material.opacity = btn ? 1 : 0.7;
  gazeDot.scale.setScalar(btn ? 1.6 : 1);
  if (btn !== dwell.button) { dwell = { button: btn, t: 0 }; drawPanel(); return; }
  if (!btn || dwellCooldown > 0) return;
  dwell.t = Math.min(1, dwell.t + dt / DWELL_SEC);
  if (dwell.t >= 1) {
    btn.act();
    dwellCooldown = 1.0;
    dwell = { button: btn, t: 0 };
    xrInputs.forEach((s) => buzz(s, 0.5, 40));
  }
  drawPanel();
}

let mouseGrab = null, mouseHover = null;
const ndc = new THREE.Vector2();
function mouseRay(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return [raycaster.ray.origin.clone(), raycaster.ray.direction.clone()];

  const a = axisWorld(g.part), p0 = hit.point.clone();
  const s0 = p0.clone().project(camera), s1 = p0.clone().add(a.multiplyScalar(0.1)).project(camera);
  const screenAxis = new THREE.Vector2((s1.x - s0.x) * innerWidth / 2, -(s1.y - s0.y) * innerHeight / 2);
  mouseGrab = { g, x: e.clientX, y: e.clientY, dir2: screenAxis.clone().normalize(), pxPerMeter: Math.max(screenAxis.length() / 0.1, 50) };
});
addEventListener('pointermove', (e) => {
  if (mouseGrab) {
    const { g } = mouseGrab;
    const px = (e.clientX - mouseGrab.x) * mouseGrab.dir2.x + (e.clientY - mouseGrab.y) * mouseGrab.dir2.y;
    setPartOffset(g, g.startOffset + px / mouseGrab.pxPerMeter);

  }

});

// ======================= AI 에이전트 연결 (agent/ 서버) =======================
// 약속 (agent/server/main.py): 3D → {"type":"step","step_id":"S03","by":"ui"}
//                              서버 → {"type":"nav",cmd|to}, {"type":"highlight",part_ids}, step_card, answer, prompt, toast
const agent = { on: false, kb: null, ws: null, card: null, reply: null, toast: '', toastT: 0, status: 'AI 연결 중…',
  phase: 'work', commentT: 0, builder: new URLSearchParams(location.search).get('op') || '' };
const agentHi = new Map();          // 부품 → 남은 강조 시간(초)

// 에이전트 부품 id → 우리 3D 부품들
function agentPartsFor(id) {
  const unit = (n) => steps.find((s) => s.unit && s.title.includes(`액추에이터 ${n}`))?.parts || [];
  if (id === 'actuator_1') return unit(1);

  const name = sanitize(alias[id] || id);
  return parts.filter((p) => p.mesh.name === name);
}
function agentHighlight(ids, sec = 6) {

}
function tickAgent(dt) {
  for (const [p, t] of agentHi) { if (t - dt <= 0) agentHi.delete(p); else agentHi.set(p, t - dt); }
  if (agent.toastT > 0 && (agent.toastT -= dt) <= 0) { agent.toast = ''; drawInfo(); }
  if (VOICE.waitQ > 0 && (VOICE.waitQ -= dt) <= 0) drawInfo();
  if (agent.commentT > 0 && (agent.commentT -= dt) <= 0) drawInfo();
}
function agentStep(k) {

}

// 음성 답: 서버 TTS → 안 되면 브라우저 음성.
// 지금은 꺼 둠 (답은 오른쪽 패널에 글로만). 다시 켜려면 주소에 ?tts=1
const TTS_ON = new URLSearchParams(location.search).get('tts') === '1';
let agentAudio = null;
async function say(text) {
  if (!text || !TTS_ON) return;
  try {
    const r = await fetch('/api/tts?text=' + encodeURIComponent(text));
    if (r.status === 200) { agentAudio?.pause(); agentAudio = new Audio(URL.createObjectURL(await r.blob())); await agentAudio.play(); return; }
  } catch {}
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; speechSynthesis.speak(u);
  }
}

function agentHandle(m) {
  if (!m || !m.type) return;
  if (m.type === 'step_card') { agent.card = m; agent.reply = null; }
  else if (m.type === 'answer') { agent.reply = { kind: 'answer', q: m.question, text: m.text || m.speech, src: m.sources || [] }; say(m.speech); }
  else if (m.type === 'prompt') { agent.reply = { kind: m.level === 'danger' ? 'danger' : 'prompt', text: m.text || m.speech }; say(m.speech); }
  else if (m.type === 'highlight') agentHighlight(m.part_ids);
  else if (m.type === 'nav') {
    if (m.cmd === 'next') goTo(shown + 1);
    else if (m.cmd === 'prev') goTo(shown - 1);
    else if (m.cmd === 'first') goTo(0);
    else if (m.cmd === 'replay') goTo(shown);
    else if (m.to) goTo(m.to - 1);
  }
  else if (m.type === 'quiet') { say(m.speech); agentToast('조용히 모드: 안전 경고만'); }
  else if (m.type === 'toast') agentToast(m.text);
  else if (m.type === 'archive') agentToast('기록 보관함은 PC 화면에서 볼 수 있어요');
  else if (m.type === 'error') agentToast(m.text);
  drawInfo();
}

async function connectAgent(builder = agent.builder) {
  try {
    const r = await fetch('/api/kb', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    agent.kb = await r.json();
  } catch { infoPanel.visible = false; return; }          // 에이전트 서버가 아니면 패널 없이 동작
  if (agent.kb.steps.length !== steps.length) console.warn(`단계 수가 달라요: 3D ${steps.length}, 에이전트 ${agent.kb.steps.length}`);
  builder = builder || newWorkerName();
  agent.builder = builder; agent.phase = 'work';
  const s = await fetch('/api/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ builder }) }).then((r) => r.json());
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  agent.ws = new WebSocket(`${proto}://${location.host}/ws/${s.session_id}`);
  agent.ws.onmessage = (e) => agentHandle(JSON.parse(e.data));
  agent.ws.onopen = () => {
    agent.on = true; agent.status = `AI 연결됨 · ${builder}${agent.kb.llm ? '' : ' · 키 없음(검색 답변)'}`;
    if (s.resume) agentHandle(s.resume);
    const i = s.resume?.step_id ? agent.kb.steps.findIndex((x) => x.step_id === s.resume.step_id) : -1;
    if (i >= 0) goTo(i); else if (shown >= 0 && guideActive) agentStep(shown);
    drawInfo();
  };
  agent.ws.onclose = () => { agent.on = false; agent.status = 'AI 연결 끊김'; drawInfo(); };
}

// ---------- 설계자 설명 녹화 (헤드셋 카메라로 슬라이드 찍기) ----------
// 선배가 헤드셋을 쓰고 PPT(다른 노트북·모니터)를 보며 넘기면, 화면이 바뀌고 멈출 때마다 사진을 찍는다.

// Quest 브라우저: facingMode 'ideal'이면 앞쪽 아바타 카메라(가짜 배경)를 주므로 뒤쪽(패스스루) 카메라를 꼭 집어 요청.

  return g;
}
function capShot(why = 'auto') {
  const v = CAP.video; if (!CAP.on || !v?.videoWidth || CAP.frames.length >= CAP.max) return;
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const t = (performance.now() - CAP.t0) / 1000;
  c.toBlob((b) => { CAP.frames.push({ b, t }); CAP.last = capGray(); capStatus(); }, 'image/jpeg', 0.9);
  if (why === 'manual') { agentToast('📸 찍었어요'); xrInputs.forEach((s) => buzz(s, 0.3, 30)); }
}

  if (!CAP.last || !CAP.video.videoWidth) return;
  const g = capGray(), dif = (a, b) => a.reduce((s, v, i) => s + Math.abs(v - b[i]), 0) / a.length;
  const moved = dif(g, CAP.last), settle = CAP.prev ? dif(g, CAP.prev) : 99; CAP.prev = g;

}
function capStatus() { agent.status = `● 설명 녹화 중 · 사진 ${CAP.frames.length}장 · "찍어" "녹화 끝"`; drawInfo(); drawPanel(); }
async function capStart() {
  if (CAP.on || CAP.busy) return;
  if (!agent.on) { agentToast('AI 서버에 연결돼야 녹화할 수 있어요'); return; }
  const v = { width: { ideal: 1280 }, height: { ideal: 960 } };
  try {
    try { CAP.stream = await navigator.mediaDevices.getUserMedia({ video: { ...v, facingMode: { exact: 'environment' } } }); }
    catch { CAP.stream = await navigator.mediaDevices.getUserMedia({ video: { ...v, facingMode: { ideal: 'environment' } } }); }
  } catch (e) { agentToast(`카메라를 열 수 없어요 (${e.name})`); return; }

  await CAP.video.play().catch(() => {});
  const sm = document.createElement('canvas'); sm.width = 48; sm.height = 36; CAP.sctx = sm.getContext('2d', { willReadFrequently: true });

  setTimeout(() => capShot(), 1500);

}
async function capStop() {
  if (!CAP.on) return;

  CAP.stream.getTracks().forEach((t) => t.stop());
  agent.status = CAP.status0;
  if (!CAP.frames.length) { agentToast('찍힌 슬라이드가 없어요'); drawPanel(); return; }
  CAP.busy = true; drawPanel();
  agentToast(`사진 ${CAP.frames.length}장 보내는 중…`);
  const fd = new FormData();
  CAP.frames.forEach((f, i) => fd.append('frames', f.b, `f_${i + 1}.jpg`));
  fd.append('frame_times', JSON.stringify(CAP.frames.map((f) => f.t)));
  try {
    const j = await fetch('/api/briefing', { method: 'POST', body: fd }).then((r) => r.json());
    let st;
    for (;;) {
      await new Promise((r) => setTimeout(r, 1500));
      st = await fetch('/api/briefing/' + j.id).then((r) => r.json());
      if (st.ok === true || st.ok === false) break;
      agent.toast = `슬라이드 읽는 중… ${(st.log || []).slice(-1)[0]?.slice(9) || ''}`; agent.toastT = 3; drawInfo();
    }
    if (st.ok) {
      agent.kb = await fetch('/api/kb', { cache: 'no-store' }).then((r) => r.json());
      if (shown >= 0) agentStep(shown);                       // 지금 단계 카드를 새 지식으로
      agentToast(`설명 반영 완료 · 슬라이드 ${st.slides}장, 설계자 말 ${st.segments}문장`);
      agent.reply = { kind: 'answer', q: '설명 녹화', text: `슬라이드 ${st.slides}장을 읽어 단계 안내를 다시 만들었어요. 설계자 말 ${st.segments}문장은 그대로예요.`, src: [] };
    } else agentToast('분석 실패: ' + ((st.log || []).slice(-1)[0] || ''));
  } catch (e) { agentToast('업로드 실패: ' + e.message); }
  CAP.busy = false; drawPanel(); drawInfo();
}

// ---------- 조립 완료 → 한마디 → 다음 사람 ----------
// 완료를 누르면 서버가 이 사람 기록을 저장하고 바로 공통 지식(aggregate)에 합친다. 다음 사람은 새 작업자로 시작해서
// 앞사람들이 오래 걸린 곳·물어본 것·남긴 한마디를 단계 카드와 답변에서 바로 받는다.
function newWorkerName() {
  const d = new Date(), z = (n) => String(n).padStart(2, '0');
  return `작업자-${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
}
function finishWork() {
  if (!agent.on) { agentToast('AI 서버에 연결돼야 기록을 저장할 수 있어요'); return; }
  if (agent.phase === 'comment') return;
  agent.ws.send(JSON.stringify({ type: 'finish' }));
  agent.phase = 'comment'; agent.commentT = 25;                 // 25초 동안은 호출어 없이 한 말을 한마디로 받음
  agentToast('기록 저장됨 · 막혔던 점을 말로 남기거나 "다음 사람"');
  drawPanel();
}
function sendComment(text) {
  agent.ws.send(JSON.stringify({ type: 'final_comment', text }));
  agent.reply = { kind: 'answer', q: text, text: '고맙습니다. 다음 작업자에게 전달할게요.', src: [] };
  agent.commentT = 0;
  setTimeout(() => { if (agent.phase === 'comment') nextWorker(); }, 3500);
}
async function nextWorker() {
  const old = agent.ws;
  if (old) { old.onclose = null; old.onmessage = null; try { old.close(); } catch {} }
  agent.on = false; agent.card = null; agent.reply = null; agent.status = 'AI 연결 중…';
  agent.phase = 'work'; agent.commentT = 0;
  goTo(-1); placeInFront = true;
  await connectAgent(newWorkerName());
  agentToast(`새 작업자 시작 · 앞사람 기록 반영됨`);
  drawPanel();
}

// ---------- 음성: 계속 듣다가 말 한 마디씩 잘라서 서버(/api/stt)로 ----------
// 규칙 (팀원 문서): 단계 명령(다음·이전·다시·처음·N단계)은 바로, 질문은 호출어로 시작해야 받음.
// 호출어만 말하면 "네?" 하고 5초 동안 질문을 기다림. 호출어 없는 주변 대화는 보내지도 저장하지도 않음.
const VOICE = {
  on: false, stream: null, ctx: null, proc: null,
  wake: new URLSearchParams(location.search).get('wake') ?? '자비스',   // ?wake= 로 바꾸기, 빈 값이면 호출어 없이
  floor: 0.01, speaking: false, frames: [], pre: [], loudT: 0, quietT: 0, len: 0, busy: 0, waitQ: 0, heard: '',
};

const VOICE_AUDIO = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
async function voiceStart() {
  if (VOICE.on) return;
  if (!agent.on) { agentToast('AI 서버에 연결돼야 음성을 쓸 수 있어요'); return; }
  try {
    VOICE.stream = await navigator.mediaDevices.getUserMedia({ audio: VOICE_AUDIO });
  } catch (e) { agentToast(`마이크를 열 수 없어요 (${e.name})`); return; }
  VOICE.ctx = new AudioContext();
  VOICE.ctx.resume?.();
  const src = VOICE.ctx.createMediaStreamSource(VOICE.stream);
  VOICE.proc = VOICE.ctx.createScriptProcessor(2048, 1, 1);
  VOICE.proc.onaudioprocess = (e) => onFrame(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(VOICE.proc);
  VOICE.proc.connect(VOICE.ctx.destination);      // 연결해 둬야 처리가 돈다 (출력은 무음)
  VOICE.on = true;
  drawPanel(); drawInfo();
}
function voiceStop() {
  VOICE.on = false; VOICE.speaking = false; VOICE.frames = [];
  VOICE.proc?.disconnect(); VOICE.stream?.getTracks().forEach((t) => t.stop()); VOICE.ctx?.close();
  drawPanel(); drawInfo();
}
// 한 조각(약 43ms)마다: 소리 크기로 말 시작·끝을 판단 (주변 소음 수준에 맞춰 기준이 움직임)
function onFrame(d) {
  if (!VOICE.on) return;
  const dt = d.length / VOICE.ctx.sampleRate;
  let s = 0; for (const v of d) s += v * v;
  const rms = Math.sqrt(s / d.length);
  const loud = rms > Math.max(0.02, VOICE.floor * 3) && !aiTalking();
  if (!VOICE.speaking) {
    VOICE.floor = VOICE.floor * 0.97 + rms * 0.03;
    VOICE.pre.push(d); if (VOICE.pre.length > 8) VOICE.pre.shift();     // 말 시작 직전 0.35초도 함께
    VOICE.loudT = loud ? VOICE.loudT + dt : 0;
    if (VOICE.loudT > 0.12) { VOICE.speaking = true; VOICE.frames = [...VOICE.pre]; VOICE.len = 0; VOICE.quietT = 0; drawInfo(); }
  } else {
    VOICE.frames.push(d); VOICE.len += dt;
    VOICE.quietT = loud ? 0 : VOICE.quietT + dt;
    if (VOICE.quietT > 0.6 || VOICE.len > 8) {          // 0.6초 조용하면 말 끝
      const frames = VOICE.frames; VOICE.speaking = false; VOICE.frames = []; VOICE.pre = [];
      if (VOICE.len > 0.35) sendUtterance(frames, VOICE.ctx.sampleRate);
      drawInfo();
    }
  }
}
// 16kHz 모노 WAV 로 줄여서 보냄
function toWav(frames, rate) {
  const all = new Float32Array(frames.reduce((n, f) => n + f.length, 0));
  let o = 0; for (const f of frames) { all.set(f, o); o += f.length; }
  const step = rate / 16000, n = Math.floor(all.length / step);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (p, t) => [...t].forEach((ch, i) => v.setUint8(p + i, ch.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);

}
async function sendUtterance(frames, rate) {
  VOICE.busy++; drawInfo();
  try {
    const fd = new FormData(); fd.append('audio', toWav(frames, rate), 'q.wav');
    const r = await fetch('/api/stt', { method: 'POST', body: fd }).then((x) => x.json());
    if (r.text) onHeard(r.text);
  } catch (e) { console.warn('stt', e); }
  finally { VOICE.busy--; drawInfo(); }
}
function agentAsk(text) { if (agent.on) agent.ws.send(JSON.stringify({ type: 'ask', text })); }
// 단계 명령을 에이전트가 확실히 알아듣는 모양으로 ("3단계로 가죠" → "3단계", "다섯 번째 단계" → "5단계")
const KO_NUM = { 일: 1, 이: 2, 삼: 3, 사: 4, 오: 5, 육: 6, 칠: 7, 팔: 8, 구: 9, 십: 10, 십일: 11, 십이: 12, 십삼: 13, 십사: 14,
  한: 1, 하나: 1, 첫: 1, 첫번: 1, 두: 2, 둘: 2, 세: 3, 셋: 3, 네: 4, 넷: 4, 다섯: 5, 여섯: 6, 일곱: 7, 여덟: 8, 아홉: 9, 열: 10,
  열한: 11, 열하나: 11, 열두: 12, 열둘: 12, 열세: 13, 열셋: 13, 열네: 14, 열넷: 14 };
function stepNumber(compact) {
  if (/^(마지막|끝)단계/.test(compact)) return steps.length;
  const m = compact.match(/^(\d+|[일이삼사오육칠팔구십]+|[가-힣]{1,3}?)번?(째)?단계/);
  if (!m) return null;
  if (m[1] === '이' && !/^이번/.test(compact)) return null;   // "이 단계 어려워"의 '이'는 2가 아님
  const n = /^\d+$/.test(m[1]) ? +m[1] : KO_NUM[m[1]];
  return n >= 1 && n <= steps.length ? n : null;
}
function navCommand(compact) {
  if (compact.length > 12) return null;
  if (/^다음/.test(compact)) return '다음';
  if (/^(이전|뒤로|전단계)/.test(compact)) return '이전';
  if (/^다시/.test(compact)) return '다시';
  const n = stepNumber(compact);

}
// 아래 버튼과 같은 일 (서버를 거치지 않고 바로). 단계를 바꾸는 건 goTo가 서버에 알린다
const VIEW_CMDS = [
  [/^(설명)?녹화(시작|해|켜)/, '설명 녹화 시작', () => capStart()],
  [/^(설명)?녹화(끝|종료|그만|꺼|멈춰)/, '설명 녹화 끝', () => capStop()],
  [/^(사진)?찍어|^캡처/, '사진 찍기', () => (CAP.on ? capShot('manual') : agentToast('녹화 중일 때만 찍어요'))],
  [/^다음(사람|작업자)/, '다음 사람 시작', () => nextWorker()],
  [/^(조립)?(완료|다했|끝났|끝$)/, '조립 완료', () => finishWork()],
  [/^처음(부터)?|^맨처음|^첫화면/, '처음부터', () => goTo(-1)],
  [/^(전체|다)(보기|봐|보여)/, '전체 보기', showAll],
  [/^(모두|전부|다)(펼|분해|풀어|벌려)|^펼쳐/, '모두 펼치기', () => animateAll(1)],
  [/^(모두|전부|다)(조립|합쳐|모아|붙여|접어)|^조립해/, '모두 조립', () => animateAll(0)],
  [/^(기본|원래)(배치|자리|위치)|^제자리|^가져와|^앞으로와/, '기본 배치', () => { placeInFront = true; }],

function viewCommand(compact) {

}
// 단계·화면 명령이면 실행하고 true
function runCommand(t, compact) {
  const v = viewCommand(compact);
  if (v) { VOICE.heard = t; v.run(); agentToast(`🎤 ${v.label}`); return true; }
  const nav = navCommand(compact);
  if (!nav) return false;

  else if (nav === '다음') goTo(shown + 1);

}
// 막힌 듯한 짧은 혼잣말은 호출어 없이도 보냄 (팀원 문서 예외 6번. 서버가 "어떤 부분이 막히셨어요?" 한 번만)

  if (agent.phase === 'comment' && agent.commentT > 0) {                       // 완료 뒤 25초: 호출어 없이 한마디
    if (/^(없어|없음|없습니다|괜찮)/.test(compact)) { VOICE.heard = t; nextWorker(); return; }
    VOICE.heard = t; sendComment(t); return;
  }
  if (STUCK_RE.test(t) && compact.length <= 12) { VOICE.heard = t; agentAsk(t); return; }
  const w = VOICE.wake;
  if (!w) { VOICE.heard = t; agentAsk(t); return; }
  if (VOICE.waitQ > 0) { VOICE.waitQ = 0; if (runCommand(t, compact)) return; VOICE.heard = t; agentAsk(t); return; }   // "네?" 다음 5초 안의 말
  const i = compact.indexOf(w);
  if (i < 0 || i > 3) return;                                                                    // 호출어 없는 말은 무시
  const q = t.slice(t.indexOf(w) + w.length).replace(/^[\s,야아님씨]+/, '').trim();
  if (q && runCommand(t, q.replace(/[\s,.]/g, ''))) return;                     // "자비스, 7단계로 가" · "자비스 모두 펼쳐"
  VOICE.heard = t;
  if (!q) { say('네?'); VOICE.waitQ = 5; xrInputs.forEach((s) => buzz(s, 0.4, 40)); drawInfo(); return; }   // 패널에 "네? 말씀하세요"
  agentAsk(q);
}

// ---------- 오른쪽 설명 패널 (헤드셋 안에서 보이는 에이전트 화면) ----------
const INFO_W = 1024, INFO_H = 1240;
const infoCanvas = document.createElement('canvas');
infoCanvas.width = INFO_W; infoCanvas.height = INFO_H;
const ictx = infoCanvas.getContext('2d');
const infoTex = new THREE.CanvasTexture(infoCanvas);
infoTex.colorSpace = THREE.SRGBColorSpace;
const infoPanel = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.32 * INFO_H / INFO_W), new THREE.MeshBasicMaterial({ map: infoTex, transparent: true }));

function wrapText(c, text, maxW) {
  const out = []; let line = '';
  for (const ch of String(text || '')) {
    if (c.measureText(line + ch).width > maxW) { out.push(line); line = ch; } else line += ch;
  }
  if (line) out.push(line);
  return out;
}
// 디자인: jarvis-previews/redesign (잘린 모서리 판 + 청록 강조, 안쪽은 테두리 없이 선·그라데이션만)
const HUD = {
  acc: '#5ce6ff', accDim: 'rgba(92,230,255,0.16)', ink: '#eef3f6', ink2: '#a9b4bc', ink3: '#6b7780',
  line: 'rgba(190,215,230,0.16)', line2: 'rgba(190,215,230,0.34)', warn: '#ffb547', danger: '#ff5d6c',
  KR: 'Pretendard, "Malgun Gothic", sans-serif', OR: 'Orbitron, "Arial Black", sans-serif', MONO: '"JetBrains Mono", Consolas, monospace',

function chamfer(c, x, y, w, h, k, notch) {
  c.beginPath(); c.moveTo(x + k, y);
  if (notch) { c.lineTo(x + w - 180, y); c.lineTo(x + w - 164, y + 12); c.lineTo(x + w - k, y + 12); c.lineTo(x + w, y + k + 12); }
  else { c.lineTo(x + w - k, y); c.lineTo(x + w, y + k); }
  c.lineTo(x + w, y + h - k); c.lineTo(x + w - k, y + h); c.lineTo(x + k, y + h); c.lineTo(x, y + h - k); c.lineTo(x, y + k); c.closePath();
}
function hazard(c, x, y, w, h, color) {   // 사선 줄무늬 띠
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.fillStyle = color;
  for (let i = -h; i < w + h; i += 20) { c.beginPath(); c.moveTo(x + i, y + h); c.lineTo(x + i + 10, y + h); c.lineTo(x + i + 10 + h, y); c.lineTo(x + i + h, y); c.fill(); }
  c.restore();
}
function specChips(st) {   // 볼트·공구·부품을 수치 칩으로 (문장보다 먼저 보이게)
  const out = [];
  const b = (st.bolts || [])[0];
  const m = b && b.match(/(M\d+)\s*(?:약\s*)?([\d.]+\s*mm)?\s*×\s*(\d+)/);
  if (m) { out.push(['BOLT', `${m[1]} ×${(st.bolts || []).reduce((s, x) => s + (+(x.match(/×\s*(\d+)/) || [0, 0])[1]), 0)}`]); if (m[2]) out.push(['LENGTH', '≈ ' + m[2].replace(/\s+/, ' ')]); }
  else if ((st.parts || [])[0]) out.push(['PART', (agent.kb?.parts?.[st.parts[0]]?.name || st.parts[0]).replace(/\s*\(.*\)$/, '')]);
  if ((st.tools || [])[0]) out.push(['TOOL', st.tools[0].replace('육각 렌치', '육각')]);
  return out.slice(0, 3);
}
function drawInfo() {

      txt(k, x + 22, y + 32, `500 19px ${HUD.MONO}`, HUD.ink3, 'left', 4);

    c.fillStyle = lg; c.fillRect(P + 140, y - 8, W - 140, 2);
    y += 22;
    (st.instructions || []).slice(0, 4).forEach((t, i) => {
      c.font = `500 32px ${HUD.KR}`; const ls = wrapText(c, t, W - 110).slice(0, 2), h = 30 + ls.length * 44;
      const g = c.createLinearGradient(P, 0, INFO_W - P, 0); g.addColorStop(0, i === 0 ? HUD.accDim : 'rgba(190,215,230,0.05)'); g.addColorStop(1, 'rgba(190,215,230,0.01)');
      c.fillStyle = g; c.fillRect(P, y, W, h); c.fillStyle = i === 0 ? HUD.acc : 'rgba(190,215,230,0.22)'; c.fillRect(P, y, 4, h);
      txt(String(i + 1).padStart(2, '0'), P + 58, y + 50, `500 22px ${HUD.MONO}`, i === 0 ? HUD.acc : HUD.ink3, 'right');
      ls.forEach((l, j) => txt(l, P + 84, y + 50 + j * 44, `500 32px ${HUD.KR}`, HUD.ink));
      y += h + 12;
    });
    // 주의 / 안전: 줄무늬 + 그라데이션 띠
    const warns = (st.warnings || []).slice(0, 2);
    if (warns.length) {
      const danger = !!st.flags?.danger, col = danger ? HUD.danger : HUD.warn;
      c.font = `500 29px ${HUD.KR}`; const lines = warns.flatMap((t) => wrapText(c, t, W - 120).slice(0, 2)).slice(0, 4);
      const h = 66 + lines.length * 40;
      const g = c.createLinearGradient(P, 0, INFO_W - P, 0); g.addColorStop(0, danger ? 'rgba(255,93,108,0.2)' : 'rgba(255,181,71,0.15)'); g.addColorStop(1, 'rgba(0,0,0,0.02)');
      c.fillStyle = g; c.fillRect(P, y + 6, W, h); hazard(c, P, y + 6, 64, h, col);
      txt(danger ? 'SAFETY' : 'CAUTION', P + 92, y + 46, `700 21px ${HUD.OR}`, col, 'left', 6);
      lines.forEach((l, j) => txt(l, P + 92, y + 90 + j * 40, `500 29px ${HUD.KR}`, danger ? '#ffd0d5' : '#ffe2b5'));
      y += h + 6;
    }
  }

  // ---------- JARVIS ----------
  const r = agent.reply;
  const jy = Math.max(y + 34, 880);
  c.fillStyle = HUD.line; c.fillRect(2, jy, INFO_W - 4, 2);
  const jg = c.createLinearGradient(0, jy, 0, INFO_H); jg.addColorStop(0, 'rgba(92,230,255,0.05)'); jg.addColorStop(0.3, 'rgba(6,9,12,0.6)'); jg.addColorStop(1, 'rgba(6,9,12,0.6)');
  c.save(); chamfer(c, 2, 2, INFO_W - 4, INFO_H - 4, 40, true); c.clip(); c.fillStyle = jg; c.fillRect(2, jy + 2, INFO_W - 4, INFO_H - jy); c.restore();
  const talking = aiTalking(), listening = VOICE.speaking || VOICE.waitQ > 0, thinking = VOICE.busy > 0;
  const state = talking ? 'SPEAKING' : thinking ? 'THINKING' : listening ? 'LISTENING' : VOICE.on ? 'STANDBY' : 'MIC OFF';
  const live = talking || thinking || listening;
  const oy = jy + 64;
  c.strokeStyle = HUD.line2; c.lineWidth = 2; c.beginPath(); c.arc(P + 34, oy, 30, 0, 7); c.stroke();
  c.setLineDash([5, 6]); c.strokeStyle = 'rgba(92,230,255,0.4)'; c.beginPath(); c.arc(P + 34, oy, 40, 0, 7); c.stroke(); c.setLineDash([]);
  const og = c.createRadialGradient(P + 34, oy, 0, P + 34, oy, 22); og.addColorStop(0, '#dffaff'); og.addColorStop(0.45, HUD.acc); og.addColorStop(1, 'rgba(92,230,255,0)');
  c.fillStyle = og; c.shadowColor = HUD.acc; c.shadowBlur = live ? 26 : 12; c.beginPath(); c.arc(P + 34, oy, live ? 22 : 16, 0, 7); c.fill(); c.shadowBlur = 0;
  txt('JARVIS', P + 96, oy + 13, `900 36px ${HUD.OR}`, HUD.ink, 'left', 12);
  c.fillStyle = live ? HUD.acc : HUD.ink3; c.beginPath(); c.arc(INFO_W - P - 168, oy - 4, 6, 0, 7); c.fill();

  if (VOICE.waitQ > 0) txt('네? 말씀하세요', P, ay, `700 32px ${HUD.KR}`, HUD.acc);
  else if (VOICE.heard && listening) txt(VOICE.heard, P, ay, `500 28px ${HUD.KR}`, HUD.ink2);
  else if (!r) txt(hint, P, ay, `500 24px ${HUD.MONO}`, HUD.ink3);
  if (r) {
    if (r.q) {   // 질문: 오른쪽 말풍선
      c.font = `500 28px ${HUD.KR}`; const q = wrapText(c, r.q, W * 0.7)[0] || '', qw = c.measureText(q).width + 44;
      c.fillStyle = 'rgba(190,215,230,0.1)'; c.beginPath(); c.roundRect(INFO_W - P - qw, ay - 38, qw, 58, [24, 24, 4, 24]); c.fill();
      txt(q, INFO_W - P - 22, ay, `500 28px ${HUD.KR}`, HUD.ink2, 'right'); ay += 54;
    }
    const col = r.kind === 'danger' ? HUD.danger : r.kind === 'prompt' ? HUD.warn : HUD.acc;
    c.font = `500 33px ${HUD.KR}`; const ls = wrapText(c, r.text, W - 50).slice(0, 5);
    const h = 34 + ls.length * 46 + (r.src?.length ? 36 : 0);
    const g = c.createLinearGradient(P, 0, INFO_W - P, 0);
    g.addColorStop(0, r.kind === 'danger' ? 'rgba(255,93,108,0.2)' : r.kind === 'prompt' ? 'rgba(255,181,71,0.15)' : HUD.accDim); g.addColorStop(1, 'rgba(0,0,0,0.02)');
    c.fillStyle = g; c.fillRect(P, ay, W, h); c.fillStyle = col; c.fillRect(P, ay, 4, h);
    ls.forEach((l, j) => txt(l, P + 26, ay + 48 + j * 46, `500 33px ${HUD.KR}`, HUD.ink));
    if (r.src?.length) txt('SRC // ' + r.src.join(' · '), P + 26, ay + 48 + ls.length * 46, `500 20px ${HUD.MONO}`, HUD.ink3);
  }
  if (agent.toast) {   // 잠깐 뜨는 안내: 아래쪽 청록 띠
    c.font = `700 28px ${HUD.KR}`; const t = wrapText(c, agent.toast, W - 40)[0] || '';
    c.fillStyle = 'rgba(92,230,255,0.92)'; c.beginPath(); c.moveTo(P + 12, INFO_H - 112); c.lineTo(INFO_W - P, INFO_H - 112); c.lineTo(INFO_W - P, INFO_H - 60); c.lineTo(INFO_W - P - 12, INFO_H - 48); c.lineTo(P, INFO_H - 48); c.lineTo(P, INFO_H - 100); c.fill();
    txt(t, P + 22, INFO_H - 70, `700 28px ${HUD.KR}`, '#041016');
  }
  infoTex.needsUpdate = true;
}
drawInfo();
document.fonts?.ready.then(() => drawInfo());   // 웹 글꼴을 받은 뒤 다시 그림
connectAgent();

// ======================= 매 프레임 =======================
const clock = new THREE.Clock();
const ease = (t) => 1 - Math.pow(1 - t, 3);
renderCard();
setStatus('');
window.__xr = { CAP, capStart, capStop, capShot, parts, steps, camera, membersOf, goTo, showAll, beginGrab, updateGrab, endGrab, axisWorld, blockerOf, isOut, renderer, gaze: () => ({ ...gazeInfo, dwell: dwell.t, cooldown: dwellCooldown }), agent, agentHi, VOICE, onHeard, sendUtterance };   // 디버그용

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (placeInFront && renderer.xr.isPresenting) {
    const xrCam = renderer.xr.getCamera();
    const pos = new THREE.Vector3().setFromMatrixPosition(xrCam.matrixWorld);
    const fwd = new THREE.Vector3(0, 0, -1).transformDirection(xrCam.matrixWorld);
    fwd.y = 0; fwd.normalize();
    if (pos.lengthSq() > 0) {
      // 기본 배치 (시선 기준): 왼쪽 = 가상 로봇, 가운데 = 실제 로봇 자리(비움), 오른쪽 = 패널
      const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
      model.position.copy(pos).addScaledVector(fwd, LAYOUT.depth).addScaledVector(right, -LAYOUT.side);
      model.position.y = pos.y - 0.35;
      model.rotation.set(0, Math.atan2(-fwd.x, -fwd.z), 0);   // 기울기도 초기화
      model.scale.setScalar(1);                                // 실물 크기로
      // 버튼 패널은 가상 로봇 위 (오른쪽은 설명 창 자리로 비워 둠)
      panel.position.copy(model.position);
      panel.position.y = model.position.y + LAYOUT.panelAbove;
      panel.lookAt(pos);                   // 패널이 나를 보게
      // 오른쪽: AI 에이전트 설명 패널
      infoPanel.position.copy(pos).addScaledVector(fwd, LAYOUT.depth).addScaledVector(right, LAYOUT.side);
      infoPanel.position.y = pos.y - 0.10;
      infoPanel.lookAt(pos);
      placeInFront = false;
    }
  }
  if (renderer.xr.isPresenting) { updateTwoHand(); updateOneHandRotate(); updateGaze(dt); }

  hovered.clear();
  if (mouseHover && !mouseGrab && visible(mouseHover)) membersOf(mouseHover).forEach((q) => hovered.add(q));
  for (const s of xrInputs) {
    if (s.grab?.part && updateGrab(s.grab, new THREE.Vector3().setFromMatrixPosition(s.ctrl.matrixWorld))) buzz(s, 0.9, 70);
    const ax = s.gamepad?.axes;
    if (ax && !s.grab && !twoHand) {
      if (Math.abs(ax[3] || 0) > 0.2) {
        anims.length = 0;
        for (const p of parts) if (visible(p)) { p.offset = THREE.MathUtils.clamp(p.offset - ax[3] * dt * p.max, 0, p.max); applyOffset(p); }
      }
      if (Math.abs(ax[2] || 0) > 0.2 && !s.moving) model.rotateY(-ax[2] * dt * 1.5);
    }
    if (renderer.xr.isPresenting) {
      const [o, d] = s.rayOf();
      const hit = s.grab || s.moving || twoHand ? null : hitFromRay(o, d);
      const part = hit && byMesh.get(hit.object);
      s.line.scale.z = hit ? hit.distance : 0.6;
      s.line.material.color.setHex(twoHand ? 0xa855f7 : s.rot ? 0xec4899 : s.grab ? 0x22c55e : s.moving ? 0xf59e0b : part ? 0xffffff : 0x60a5fa);
      s.cursor.visible = !!hit;
      if (hit) s.cursor.position.copy(hit.point);
      if (part) { membersOf(part).forEach((q) => hovered.add(q)); if (part !== s.hoverPart) buzz(s, 0.15, 15); }
      s.hoverPart = part || null;
    }
  }

  for (let k = anims.length - 1; k >= 0; k--) {
    const a = anims[k];
    a.t += dt / 0.9;
    const t = THREE.MathUtils.clamp(a.t, 0, 1);
    for (const p of a.list) {
      const to = a.rel ? p.max * a.to : a.to;
      const from = a.rel ? a.from : a.from;
      p.offset = THREE.MathUtils.lerp(from, to, ease(t));
      applyOffset(p);
    }
    if (a.t >= 1) anims.splice(k, 1);
  }

  tickAgent(dt);
  updateLook(dt);
  if (!renderer.xr.isPresenting) orbit.update();
  renderer.render(scene, camera);
});

  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
